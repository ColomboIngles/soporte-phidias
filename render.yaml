services:
  - type: web
    name: soporte-phidias-api
    env: node
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SECRET
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_APP_URL
        sync: false
      - key: SUPPORT_ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: PASSWORD_ACTIVATION_TOKEN_TTL_HOURS
        sync: false
      - key: PASSWORD_RECOVERY_CODE_TTL_MINUTES
        sync: false
      - key: PASSWORD_RECOVERY_MAX_ATTEMPTS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_REPLY_TO
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_PASSWORD_RECOVERY_TEMPLATE_NAME
        sync: false
